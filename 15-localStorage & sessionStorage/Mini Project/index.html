<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catatan Nama Pengguna</title>
    <link rel="stylesheet" href="miniProjek.css">
</head>
<body>
    <div id="judul">
        <h1>Catatan Nama Pengguna</h1>
    </div>
    <form id="form">
        <label for="nama"><strong>Nama: </strong></label>
        <input type="text" id="nama">
        <br><br>

        <label for="email"><strong>Email: </strong></label>
        <input type="email" id="email">
        <br><br>

        <label for="jurusan"><strong>Jurusan: </strong></label>
        <input type="text" id="jurusan">
        <br><br>

        <label for="semester"><strong>Semester:</strong></label>
        <select name="semester" id="semester">
            <option value="">Pilih Semester</option>
            <option value="1">Semester 1</option>
            <option value="2">Semester 2</option>
            <option value="3">Semester 3</option>
            <option value="4">Semester 4</option>
            <option value="5">Semester 5</option>
            <option value="6">Semester 6</option>
            <option value="7">Semester 7</option>
            <option value="8">Semester 8</option>
        </select>
        <br><br>

        <button id="submit">Daftar</button>
        <button id="hapus">Hapus Data</button>
    </form>
    <script src="script.js"></script>
</body>
</html>
