<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Catatan Nama Pengguna</title>
    <!-- CDN Tailwind -->
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body class="bg-gray-100 flex items-center justify-center min-h-screen">
    <div class="bg-white shadow-lg rounded-lg p-8 w-full max-w-md">
      <h1 class="text-2xl font-bold text-center text-green-800 mb-6">
        Nama Pengguna
      </h1>

      <form id="form" class="space-y-4">
        <!-- Nama -->
        <div>
          <label for="nama" class="block font-semibold text-gray-700"
            >Nama:</label
          >
          <input
            type="text"
            id="nama"
            class="w-full border border-gray-300 rounded-md px-3 py-2 focus:outline-none focus:ring-2 focus:ring-green-500 focus:border-green-500"
            required
          />
        </div>

        <!-- Email -->
        <div>
          <label for="email" class="block font-semibold text-gray-700"
            >Email:</label
          >
          <input
            type="email"
            id="email"
            class="w-full border border-gray-300 rounded-md px-3 py-2 focus:outline-none focus:ring-2 focus:ring-green-500 focus:border-green-500"
            required
          />
        </div>

        <!-- Jurusan -->
        <div>
          <label for="jurusan" class="block font-semibold text-gray-700"
            >Jurusan:</label
          >
          <input
            type="text"
            id="jurusan"
            class="w-full border border-gray-300 rounded-md px-3 py-2 focus:outline-none focus:ring-2 focus:ring-green-500 focus:border-green-500"
            required
          />
        </div>

        <!-- Semester -->
        <div>
          <label for="semester" class="block font-semibold text-gray-700"
            >Semester:</label
          >
          <select
            id="semester"
            class="w-full border border-gray-300 rounded-md px-3 py-2 focus:outline-none focus:ring-2 focus:ring-green-500 focus:border-green-500"
            required
          >
            <option value="">Pilih Semester</option>
            <option value="1">Semester 1</option>
            <option value="2">Semester 2</option>
            <option value="3">Semester 3</option>
            <option value="4">Semester 4</option>
            <option value="5">Semester 5</option>
            <option value="6">Semester 6</option>
            <option value="7">Semester 7</option>
            <option value="8">Semester 8</option>
          </select>
        </div>

        <!-- Tombol -->
        <div class="flex gap-4">
          <button
            id="simpan"
            type="submit"
            class="flex-1 bg-green-600 text-white font-semibold py-2 rounded-md shadow-md hover:bg-green-700 transition"
          >
            Daftar
          </button>
          <button
            id="hapus"
            type="reset"
            class="flex-1 bg-red-500 text-white font-semibold py-2 rounded-md shadow-md hover:bg-red-600 transition"
          >
            Hapus Data
          </button>
        </div>

        <!-- Hasil -->
        <p
          id="hasil"
          class="text-center mt-4 p-3 rounded-md bg-green-100/70 text-green-700"
        >
          Data akan ditampilkan di sini
        </p>
      </form>
    </div>

    <script src="script.js"></script>
  </body>
</html>
