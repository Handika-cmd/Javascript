<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mini Project ToDo List</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  </head>
  <body>
    <!-- Langkah 1 — Buat wadah utama aplikasi -->
    <div class="min-h-screen bg-blue-100 flex items-center justify-center p-6">
      <!-- Langkah 2 — membuat kartu utama To-Do App. -->
      <div class="w-full bg-white max-w-md rounded-xl shadow-lg p-6">
        <!-- Langkah 3 — Judul aplikasi -->
        <h1 class="text-2xl text-green-600 font-bold mb-6 text-center">
          To-Do List Tugas
        </h1>
        <!-- Langkah 4 — Input tugas + tombol Tambah -->
        <div class="flex gap-2">
          <input
            type="text"
            id="inputTugas"
            placeholder="Tambahkan Tugas"
            class="flex-1 border border-gray-300 rounded-lg p-2 focus:outline-none focus:ring-2 focus:ring-green-300"
          />

          <button
            id="tambahTugas"
            type="button"
            class="bg-green-500 rounded-lg px-5 py-2 hover:bg-green-600 text-white text-center cursor-pointer"
          >
            Tambah
          </button>
        </div>
        <!-- Langkah 5 — Tempat daftar tugas -->
        <div class="mt-6 bg-gray-100 rounded-lg p-4">
          <h2 class="text-xl text-gray-500 text-center font-bold mb-6">
            Daftar Tugas
          </h2>
          <!-- Langkah 5.5 — Tombol filter Semua / Belum / Selesai -->
          <div class="flex gap-2 mb-4">
            <button
              data-filter="semua"
              class="filter-btn flex-1 bg-green-500 text-white rounded-lg py-1.5 cursor-pointer"
            >
              Semua
            </button>
            <button
              data-filter="belum"
              class="filter-btn flex-1 bg-gray-300 rounded-lg py-1.5 cursor-pointer"
            >
              Belum Selesai
            </button>
            <button
              data-filter="selesai"
              class="filter-btn flex-1 bg-gray-300 rounded-lg py-1.5 cursor-pointer"
            >
              Selesai
            </button>
          </div>
          <div id="daftarTugas" class="text-gray-500"></div>
        </div>
      </div>
    </div>
    <!-- Langkah 6 — Hubungkan HTML dengan JavaScript. -->
    <script src="script.js"></script>
  </body>
</html>
