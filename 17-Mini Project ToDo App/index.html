<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mini Project ToDo List</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body>
    <!-- Langkah 1 — Buat wadah utama aplikasi -->
     <div class="min-h-screen bg-blue-100 flex items-center justify-center p-6">
        <!-- Langkah 2 — membuat kartu utama To-Do App. -->
         <div class="w-full bg-white max-w-md rounded-xl shadow-lg p-6">
            <!-- Langkah 3 — Judul aplikasi -->
             <h1 class="text-2xl text-green-600 font-bold mb-6 text-center">To-Do List</h1>
             <!-- Langkah 4 — Input tugas + tombol Tambah -->
              <div class="flex gap-2">
                <input type="text" id="inputTugas" placeholder="Tambahkan Tugas" class="flex-1 border border-gray-300 rounded-lg p-2  focus:outline-none  focus:ring-2 focus:ring-green-300">

                <button id="tambahTugas" type="button" class="bg-green-500 rounded-lg px-5 py-2 hover:bg-green-600 text-white text-center">Tambah</button>
              </div>
         </div>
     </div>
    <script src="script.js"></script>
</body>
</html>
